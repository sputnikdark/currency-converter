<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Währungsrechner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Währungsrechner</h1>

        <div class="converter">
            <div class="input-group">
                <label>Ich habe:</label>
                <input type="number" id="amount-one" value="1" placeholder="0">
                <select id="currency-one">
                    <option value="EUR" selected>EUR</option>
                    <option value="USD">USD</option>
                    <option value="GBP">GBP</option>
                    <option value="CHF">CHF</option>
                </select>
            </div>

            <div class="swap-btn">
                <button id="swap">⇅</button>
            </div>

            <div class="input-group">
                <label>Ich erhalte:</label>
                <input type="number" id="amount-two" placeholder="0" disabled>
                <select id="currency-two">
                    <option value="USD" selected>USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="CHF">CHF</option>
                </select>
            </div>
        </div>

        <div class="rate" id="rate">1 EUR = ...</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
